<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101418">
    <meta name="color-scheme" content="dark">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/docs/images/voltura-earner.png">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
    <link rel="icon" href="{{ '/docs/images/voltura-earner-tray-icon.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Voltura Earner home">
        <img src="{{ '/docs/images/voltura-earner-tray-icon.png' | relative_url }}" width="32" height="32" alt="">
        <span>Voltura Earner</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="#download">Download</a>
        <a href="https://github.com/voltura/voltura-earner">GitHub</a>
      </nav>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>Voltura Earner</span>
      <span>Free and open source software for Windows. Made by <a href="https://voltura.se/" aria-label="Voltura AB home">Voltura AB</a>.</span>
    </footer>
  </body>
</html>
