version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/apps/windows"
      - "/tests/VolturaEarner.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
